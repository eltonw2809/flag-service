services:
  flag-app:
    build: ./flag-service-main
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      PORT: "8001"
      DATABASE_URL: postgres://flag_user:local_dev_password@flag-db:5432/flag_db?sslmode=disable
      MASTER_KEY: local_dev_master_key_change_me
    depends_on:
      flag-db:
        condition: service_healthy

  flag-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flag_db
      POSTGRES_USER: flag_user
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./flag-service-main/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flag_user -d flag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
